<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signalite Chat</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f0f2f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #app {
        width: 100%;
        max-width: 480px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 90vh;
        max-height: 700px;
      }

      /* ── Header ── */
      #header {
        padding: 16px 20px;
        background: #6366f1;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
      #status-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #fbbf24;
        flex-shrink: 0;
      }
      #status-dot.connected { background: #34d399; }
      #status-text { font-size: 0.78rem; opacity: 0.85; }

      /* ── Setup screen ── */
      #setup {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        gap: 20px;
        text-align: center;
      }
      #setup p { color: #6b7280; font-size: 0.9rem; line-height: 1.5; }
      #setup h2 { font-size: 1.05rem; color: #111827; }

      .invite-box {
        background: #f3f4f6;
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      .invite-box span {
        flex: 1;
        font-size: 0.78rem;
        color: #374151;
        word-break: break-all;
        text-align: left;
      }
      .copy-btn {
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 0.78rem;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .copy-btn:hover { background: #4f46e5; }

      #waiting-msg { color: #9ca3af; font-size: 0.85rem; margin-top: 4px; }

      /* ── Messages ── */
      #chat { display: none; flex-direction: column; flex: 1; overflow: hidden; }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 75%;
        padding: 9px 13px;
        border-radius: 14px;
        font-size: 0.88rem;
        line-height: 1.45;
        word-break: break-word;
      }
      .msg.mine {
        align-self: flex-end;
        background: #6366f1;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.theirs {
        align-self: flex-start;
        background: #f3f4f6;
        color: #111827;
        border-bottom-left-radius: 4px;
      }
      .msg .meta {
        font-size: 0.7rem;
        margin-top: 4px;
        opacity: 0.65;
      }
      .msg.mine .meta { text-align: right; }

      /* ── Input bar ── */
      #input-bar {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
        background: #fff;
      }
      #msg-input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 24px;
        padding: 9px 16px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s;
      }
      #msg-input:focus { border-color: #6366f1; }
      #msg-input:disabled { background: #f9fafb; }
      #send-btn {
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 40px; height: 40px;
        flex-shrink: 0;
        cursor: pointer;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      #send-btn:hover { background: #4f46e5; }
      #send-btn:disabled { background: #d1d5db; cursor: default; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="header">
        <span id="status-dot"></span>
        <h1>Signalite Chat</h1>
        <span id="status-text">Connecting…</span>
      </div>

      <!-- Setup / invite screen -->
      <div id="setup">
        <h2 id="setup-title">Starting session…</h2>
        <p id="setup-desc"></p>
        <div id="invite-area" style="display:none; width:100%; flex-direction:column; gap:10px; align-items:center;">
          <div class="invite-box">
            <span id="invite-link"></span>
            <button class="copy-btn" onclick="copyLink()">Copy</button>
          </div>
          <span id="waiting-msg">Waiting for someone to join…</span>
        </div>
      </div>

      <!-- Chat UI (shown once connected) -->
      <div id="chat">
        <div id="messages"></div>
        <div id="input-bar">
          <input id="msg-input" type="text" placeholder="Type a message…" disabled />
          <button id="send-btn" disabled>&#9658;</button>
        </div>
      </div>
    </div>

    <!-- socket.io client from CDN -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
      // ── Inline WebRTCClient (no ES-module syntax) ────────────────────────

      class WebRTCClient {
        constructor(serverUrl, channelName, onMessage, peerConnectCallback, statusCallback = null, options = {}) {
          this.serverUrl = serverUrl;
          this.channelName = channelName;
          this.peerConnection = null;
          this.channel = null;
          this.peerChannel = null;
          this.onMessage = onMessage;
          this.peerConnectCallback = peerConnectCallback;
          this.statusCallback = statusCallback;
          this.stage = 0;
          this.offerCreator = false;
          this.maxReconnectAttempts = options.maxReconnectAttempts !== undefined ? options.maxReconnectAttempts : 5;
          this.reconnectBaseDelay = options.reconnectBaseDelay || 1000;
          this.reconnectAttempts = 0;
          this._reconnectTimer = null;
          this.connectToSignalingServer();
        }

        _updateStage(stage) {
          this.stage = stage;
          if (this.statusCallback) this.statusCallback(stage);
        }

        connectToSignalingServer() {
          this.socket = io(this.serverUrl);
          this.setupSocketListeners();
        }

        disconnectFromSignalingServer() {
          if (this._reconnectTimer !== null) {
            clearTimeout(this._reconnectTimer);
            this._reconnectTimer = null;
          }
          if (this.socket && this.socket.connected) {
            this.socket.disconnect();
            this._updateStage(3);
          }
        }

        setupSocketListeners() {
          this.socket.on("connect", () => {
            this.socket.emit("join", this.channelName);
            this._updateStage(1);
          });

          this.socket.on("disconnect", () => {
            if (this.stage !== 3) console.log("Unexpected server disconnection");
          });

          this.socket.on("offerReceived", async (offer) => {
            await this.handleRemoteOffer(offer);
          });

          this.socket.on("answerReceived", async (answer) => {
            await this.handleRemoteAnswer(answer);
          });

          this.socket.on("iceCandidateReceived", async (candidate) => {
            await this.addIceCandidate(candidate);
          });
        }

        async initializePeerConnection() {
          const iceConfig = {
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          };
          this.peerConnection = new RTCPeerConnection(iceConfig);
          this.addDataChannel(this.channelName);

          this.peerConnection.ondatachannel = (event) => {
            this.peerChannel = event.channel;
            this.peerChannel.onmessage = (e) => this.onMessage(e);
            this.peerChannel.onerror = (e) => console.error("Peer channel error:", e);
            this.peerChannel.onclose = () => this.handlePeerDisconnection();
          };

          this.peerConnection.addEventListener("icecandidate", (event) => {
            if (event.candidate) this.submitIceCandidate(event.candidate);
          });

          this.peerConnection.onconnectionstatechange = () => {
            const s = this.peerConnection.connectionState;
            if (s === "connected") {
              this.reconnectAttempts = 0;
              this._updateStage(2);
              const poll = setInterval(() => {
                if (this.peerChannel !== null) {
                  clearInterval(poll);
                  this.peerConnectCallback(this.peerChannel);
                  setTimeout(() => this.disconnectFromSignalingServer(), 1000);
                }
              }, 200);
            } else if (["disconnected", "failed", "closed"].includes(s)) {
              this.handlePeerDisconnection();
            }
          };
        }

        handlePeerDisconnection() {
          if (this.stage === 2 || this.stage === 3) {
            this._updateStage(4);
            if (this.peerConnection) { this.peerConnection.close(); this.peerConnection = null; }
            this.channel = null;
            this.peerChannel = null;
            this.reconnectToSignalingServer();
          }
        }

        reconnectToSignalingServer() {
          if (this.maxReconnectAttempts !== -1 && this.reconnectAttempts >= this.maxReconnectAttempts) {
            this._updateStage(5);
            return;
          }
          this.reconnectAttempts++;
          const delay = Math.min(this.reconnectBaseDelay * Math.pow(2, this.reconnectAttempts - 1), 30000);
          if (this.socket) { this.socket.removeAllListeners(); this.socket.disconnect(); }
          this._reconnectTimer = setTimeout(() => {
            this._reconnectTimer = null;
            this.connectToSignalingServer();
            if (this.offerCreator) setTimeout(() => this.createOffer(), 2000);
          }, delay);
        }

        createOffer() {
          this.offerCreator = true;
          const poll = setInterval(async () => {
            if (this.stage === 1) {
              clearInterval(poll);
              await this.initializePeerConnection();
              const offer = await this.peerConnection.createOffer();
              await this.peerConnection.setLocalDescription(offer);
              this.socket.emit("submitOffer", { channelName: this.channelName, offer: JSON.stringify(offer) });
            }
          }, 200);
        }

        async handleRemoteOffer(offerString) {
          await this.initializePeerConnection();
          const offer = JSON.parse(offerString);
          await this.peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
          const answer = await this.peerConnection.createAnswer();
          await this.peerConnection.setLocalDescription(answer);
          this.socket.emit("submitAnswer", { channelName: this.channelName, answer: JSON.stringify(answer) });
        }

        async handleRemoteAnswer(answerString) {
          const answer = JSON.parse(answerString);
          await this.peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        }

        submitIceCandidate(candidate) {
          this.socket.emit("submitIceCandidate", { channelName: this.channelName, candidate: JSON.stringify(candidate) });
        }

        async addIceCandidate(candidateString) {
          const candidate = JSON.parse(candidateString);
          await this.peerConnection.addIceCandidate(candidate);
        }

        addDataChannel(name) {
          this.channel = this.peerConnection.createDataChannel(name, { reliable: true });
          this.channel.onmessage = (e) => this.onMessage(e);
          this.channel.onerror = (e) => console.error("Data channel error:", e);
        }

        send(msg) {
          const ch = this.peerChannel || this.channel;
          if (ch && ch.readyState === "open") ch.send(msg);
        }
      }

      // ── App logic ────────────────────────────────────────────────────────

      const SERVER_URL = window.location.origin;

      const statusDot  = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const setupEl    = document.getElementById("setup");
      const setupTitle = document.getElementById("setup-title");
      const setupDesc  = document.getElementById("setup-desc");
      const inviteArea = document.getElementById("invite-area");
      const inviteLink = document.getElementById("invite-link");
      const chatEl     = document.getElementById("chat");
      const messagesEl = document.getElementById("messages");
      const msgInput   = document.getElementById("msg-input");
      const sendBtn    = document.getElementById("send-btn");

      let client;
      let myLabel = "You";

      function setStatus(label, connected) {
        statusText.textContent = label;
        statusDot.classList.toggle("connected", connected);
      }

      function onStatusChange(stage) {
        const labels = {
          0: ["Not connected", false],
          1: ["Signaling…",    false],
          2: ["Connected",     true],
          3: ["P2P active",    true],
          4: ["Reconnecting…", false],
          5: ["Disconnected",  false],
        };
        const [label, ok] = labels[stage] || ["Unknown", false];
        setStatus(label, ok);
      }

      function appendMessage(text, mine) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + (mine ? "mine" : "theirs");
        const body = document.createElement("div");
        body.textContent = text;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        wrap.appendChild(body);
        wrap.appendChild(meta);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function onMessage(event) {
        appendMessage(event.data, false);
      }

      function onPeerConnect(ch) {
        setupEl.style.display = "none";
        chatEl.style.display = "flex";
        msgInput.disabled = false;
        sendBtn.disabled = false;
        msgInput.focus();
      }

      function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        client.send(text);
        appendMessage(text, true);
        msgInput.value = "";
      }

      sendBtn.addEventListener("click", sendMessage);
      msgInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      function copyLink() {
        navigator.clipboard.writeText(inviteLink.textContent).then(() => {
          const btn = document.querySelector(".copy-btn");
          btn.textContent = "Copied!";
          setTimeout(() => { btn.textContent = "Copy"; }, 2000);
        });
      }

      function generateChannelId() {
        return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
      }

      function start() {
        const params = new URLSearchParams(window.location.search);
        let channel = params.get("channel");

        if (channel) {
          // ── Joiner ──
          myLabel = "You (joined)";
          setupTitle.textContent = "Joining session…";
          setupDesc.textContent = "Connecting to your peer. This should only take a moment.";
          setStatus("Joining…", false);

          client = new WebRTCClient(SERVER_URL, channel, onMessage, onPeerConnect, onStatusChange);
        } else {
          // ── Creator ──
          channel = generateChannelId();
          const link = window.location.origin + window.location.pathname + "?channel=" + channel;

          setupTitle.textContent = "Share this link";
          setupDesc.textContent = "Send the link below to the person you want to chat with. The chat will open automatically once they join.";
          inviteLink.textContent = link;
          inviteArea.style.display = "flex";
          setStatus("Waiting for peer…", false);

          client = new WebRTCClient(SERVER_URL, channel, onMessage, onPeerConnect, onStatusChange);
          client.createOffer();
        }
      }

      start();
    </script>
  </body>
</html>
